<!doctype html>
<!-- Shown by the service worker (public/sw.js) when a page that hasn't been visited before is
     opened without a connection. Stand-alone: no Next.js, no web fonts, only the wordmark, which
     the service worker keeps. The colours are the site's tokens (globals.css) written out. -->
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline — AOD</title>
    <style>
      :root { --brand: #ff6201; --brand-hover: #e05601; --ink: #000000; --muted: #5c5c5c; --line: #e6e6e6; --wash: #fff4ed; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--wash);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 100%; max-width: 420px; padding: 32px 28px; border: 1px solid var(--line); border-radius: 20px; background: #fff; text-align: center; }
      img { width: 120px; height: auto; }
      h1 { margin: 24px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button { width: 100%; padding: 12px 20px; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: var(--brand-hover); }
      a { color: var(--ink); font-weight: 600; }
      small { display: block; margin-top: 20px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img src="/aod-wordmark.png" alt="AOD" width="708" height="200" />
      <h1>You're offline</h1>
      <p>This page needs a connection. Check your internet and try again — the page reloads by itself once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>Need us now? Call <a href="tel:+919274739763">+91 92747 39763</a></small>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
