<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · AOD</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #111111;
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #555555; margin: 0 0 24px; }
      button {
        font: inherit;
        border: 0;
        border-radius: 8px;
        padding: 12px 20px;
        background: #ff6201;
        color: #ffffff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="AOD" />
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
